:root {

.tagline {

}

.subline {

  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--stone);
}

/* ---------- NAV ---------- */
nav {

  justify-content: center;
  gap: 6px;
  padding: 20px 16px 8px;

.nav-btn {

  padding: 8px 18px;

  color: var(--stone-dark);

}

.nav-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }
.nav-btn:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }

.grid {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 100px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 2px;
  background: var(--line);
}

.empty-state {
  grid-column: 1 / -1;
  background: var(--white);
  text-align: center;
  padding: 60px 20px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--stone-dark);
}

  .brand { font-size: 1.7rem; }
  .tagline, .subline { display: none; }
  nav { padding: 8px 12px 4px; gap: 4px; }
  .nav-btn { padding: 5px 12px; font-size: 0.6rem; }
  .grid { grid-template-columns: repeat(2, 1fr); padding: 10px 8px 60px; gap: 1px; }
  .card-img-wrap { aspect-ratio: 1 / 1; }
  .card-info { padding: 6px 3px 14px; }
  .card-name { font-size: 0.7rem; }
  .card-meta { font-size: 0.58rem; margin-top: 3px; }
  .card-id { font-size: 0.5rem; padding: 2px 5px; }
  .sold-tag { font-size: 0.48rem; padding: 3px 6px; }
}

.card {
  background: var(--white);
  cursor: pointer;
  position: relative;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
  border: none;
  text-align: left;
  width: 100%;
  padding: 0;
  font: inherit;
  color: inherit;
}

.card:focus-visible { outline: 2px solid var(--black); outline-offset: -2px; }

@keyframes fadeIn { to { opacity: 1; } }

.card-img-wrap {
  position: relative;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--offwhite);
}

.card-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

.card:hover .card-img-wrap img { transform: scale(1.03); }

.card-id {
  position: absolute; top: 10px; left: 10px;
  font-size: 0.62rem; letter-spacing: 0.1em;
  background: var(--white); color: var(--black);
  padding: 3px 7px;
}

.sold-tag {
  position: absolute; top: 10px; right: 10px;
  font-size: 0.6rem; letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--black); color: var(--white);
  padding: 4px 8px;
}

.card.is-sold .card-img-wrap img { filter: grayscale(1) opacity(0.55); }

.card-info { padding: 12px 4px 30px; }

.card-name {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 600; font-size: 1rem;
  text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.15;

.card-meta {

}

.info-block { padding: 22px 0; border-bottom: 1px solid var(--line); }

.info-heading {

.info-list { list-style: none; counter-reset: step; }
.info-list li {
  font-size: 0.85rem; line-height: 1.8; color: #3a3733;
  padding-left: 20px; position: relative;

.info-list li::before {

  position: absolute; left: 0;
  font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--stone-dark);

.info-bullets { list-style: none; padding: 0; margin: 0; }
.info-bullets li {
  font-size: 0.85rem; line-height: 1.8; color: #3a3733;
  padding-left: 18px; position: relative;

.info-bullets li::before {

.modal-backdrop {

/* =========================================================================
   SECTION 4 — SITE RENDERING
   Nothing below this line normally needs editing.
========================================================================= */

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const FALLBACK_IMG = "https://placehold.co/700x875/e3ddd0/6b665c?text=Photo+Coming+Soon";

function safeImages(p) {
  return (Array.isArray(p.images) && p.images.length > 0) ? p.images : [FALLBACK_IMG];
}

const navEl = document.getElementById("nav");
const mainEl = document.getElementById("mainContent");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalEl = document.getElementById("modal");
let lastFocused = null;

const TABS = ["AVAILABLE", ...(CONFIG.showArchive && CONFIG.showSoldProducts ? ["ARCHIVE"] : []), "INFO"];

function renderNav(activeTab) {
  navEl.innerHTML = "";
  TABS.forEach(tab => {
    const btn = document.createElement("button");
    btn.className = "nav-btn" + (tab === activeTab ? " active" : "");
    btn.textContent = tab;
    btn.setAttribute("aria-pressed", tab === activeTab ? "true" : "false");
    btn.onclick = () => renderTab(tab);
    navEl.appendChild(btn);
  });
}

function renderTab(tab) {
  renderNav(tab);
  if (tab === "AVAILABLE") renderGrid(PRODUCTS.filter(p => p.status === "available"));
  else if (tab === "ARCHIVE") renderGrid(PRODUCTS.filter(p => p.status === "sold"));
  else renderInfo();
}

function renderGrid(items) {
  mainEl.innerHTML = `<div class="grid" id="grid"></div>`;
  const gridEl = document.getElementById("grid");

  if (items.length === 0) {
    gridEl.innerHTML = `<div class="empty-state">Nothing here right now</div>`;
    return;
  }

  items.forEach((p, i) => {
    const isSold = p.status === "sold";
    const imgs = safeImages(p);
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card" + (isSold ? " is-sold" : "");
    card.style.animationDelay = (i * 0.04) + "s";
    card.setAttribute("aria-label", `${p.name}, ${p.price}${isSold ? ", sold" : ""}`);

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${imgs[0]}" alt="${escapeHtml(p.name)}" loading="${i < 4 ? 'eager' : 'lazy'}">
        <div class="card-id mono">${escapeHtml(p.id)}</div>
        ${isSold ? '<div class="sold-tag">Sold</div>' : ''}
      </div>
      <div class="card-info">
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-meta mono">
          <span>${escapeHtml(p.price)}</span>
          <span>${escapeHtml(p.size)}</span>
        </div>
      </div>
    `;
    card.onclick = () => openModal(p);
    gridEl.appendChild(card);
  });
}

function renderInfo() {
  const c = CONFIG;
  const paymentText = c.prepaidAvailable && c.codAvailable ? "PREPAID + COD AVAILABLE"
    : c.prepaidAvailable ? "PREPAID AVAILABLE"
    : c.codAvailable ? "COD AVAILABLE"
    : "CONTACT US FOR PAYMENT OPTIONS";

  mainEl.innerHTML = `
    <div class="info-panel">
      <div class="info-block">
        <div class="info-heading">How to Order</div>
        <ol class="info-list">
          ${c.orderInstructions.map(step => `<li>${escapeHtml(step)}</li>`).join("")}
        </ol>
      </div>
      <div class="info-block">
        <div class="info-heading">Payment</div>
        <div class="info-text mono">${paymentText}</div>
      </div>
      <div class="info-block">
        <div class="info-heading">Shipping</div>
        <ul class="info-bullets">
          ${c.shippingPoints.map(pt => `<li>${escapeHtml(pt)}</li>`).join("")}
        </ul>
      </div>
      <div class="info-block">
        <div class="info-heading">Condition Guide</div>
        ${c.conditionGuide.map(cg => `
          <div class="condition-row">
            <span>${escapeHtml(cg.rating)}</span>
            <span>${escapeHtml(cg.label)}</span>
          </div>
        `).join("")}
      </div>
      <div class="info-block">
        <div class="info-heading">Returns</div>
        <div class="info-text">${escapeHtml(c.returnPolicy)}</div>
      </div>
    </div>
  `;
}

/* =========================================================================
   SECTION 6 — PURCHASE LINKS
========================================================================= */
function waLink(p) {
  const msg = `Hello, I am interested in buying this product.\n\nProduct ID: ${p.id}\nProduct Name: ${p.name}\n\nPlease share the details.`;
  return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;
}
function igLink() {
  return `https://www.instagram.com/${CONFIG.instagramUsername}/`;
}
function igMessage(p) {
  return `Hello, I am interested in buying this product.\n\nProduct ID: ${p.id}\nProduct Name: ${p.name}\n\nPlease share the details.`;
}

/* =========================================================================
   SECTION 5 — PRODUCT MODAL
========================================================================= */
function openModal(p) {
  lastFocused = document.activeElement;
  const isSold = p.status === "sold";
  const imgs = safeImages(p);
  const m = p.measurements || {};

  const thumbs = imgs.length > 1
    ? `<div class="modal-thumbs">${imgs.map((img, i) =>
        `<button type="button" data-idx="${i}" aria-label="View photo ${i + 1}">
           <img src="${img}" class="${i === 0 ? 'active' : ''}" alt="${escapeHtml(p.name)} photo ${i + 1}">
         </button>`
      ).join("")}</div>`
    : "";

  const specs = [];
  if (m.chest) specs.push(`<div><div class="spec-label">Chest</div><div class="spec-value">${escapeHtml(m.chest)}</div></div>`);
  if (m.length) specs.push(`<div><div class="spec-label">Length</div><div class="spec-value">${escapeHtml(m.length)}</div></div>`);
  specs.push(`<div><div class="spec-label">Size</div><div class="spec-value">${escapeHtml(p.size)}</div></div>`);
  specs.push(`<div><div class="spec-label">Condition</div><div class="spec-value">${escapeHtml(p.condition)}</div></div>`);

  modalEl.innerHTML = `
    <div class="modal-close"><button id="closeBtn" aria-label="Close product details">Close ✕</button></div>
    <img class="modal-img" id="modalMainImg" src="${imgs[0]}" alt="${escapeHtml(p.name)}">
    ${thumbs}
    <div class="modal-body">
      <div class="modal-id mono">${escapeHtml(p.id)}</div>
      <h2 class="modal-name" id="modalNameHeading">${escapeHtml(p.name)}</h2>
      <div class="modal-price mono">${escapeHtml(p.price)}</div>
      <div class="modal-specs">${specs.join("")}</div>
      <div class="modal-desc">${escapeHtml(p.description)}</div>
      ${isSold
        ? `<div class="modal-sold-note">This piece has been claimed</div>`
        : `<div class="scarcity-note">One piece only · First confirmed order gets it</div>
           <div class="buy-row">
              <a class="buy-btn wa" href="${waLink(p)}" target="_blank" rel="noopener noreferrer">Buy on WhatsApp</a>
              <button type="button" class="buy-btn ig" data-product-id="${escapeHtml(p.id)}" data-product-name="${escapeHtml(p.name)}" onclick="handleIgBuy(this)">Buy on Instagram</button>
           </div>`
      }
    </div>
  `;

  document.getElementById("closeBtn").onclick = closeModal;

  if (imgs.length > 1) {
    modalEl.querySelectorAll(".modal-thumbs button").forEach(btn => {
      btn.onclick = () => {
        const idx = btn.dataset.idx;
        document.getElementById("modalMainImg").src = imgs[idx];
        modalEl.querySelectorAll(".modal-thumbs img").forEach(t => t.classList.remove("active"));
        btn.querySelector("img").classList.add("active");
      };
    });
  }

  modalBackdrop.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("closeBtn").focus();
}

function closeModal() {
  modalBackdrop.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocused) lastFocused.focus();
}

/* =========================================================================
   SECTION 6b — INSTAGRAM BUY HANDLER
   Copies the product message to clipboard, then opens Instagram profile.
   Instagram does not support pre-filled DMs via web URLs.
   The user can paste the copied message directly into the DM.
========================================================================= */
function handleIgBuy(btn) {
  const productId   = btn.getAttribute("data-product-id");
  const productName = btn.getAttribute("data-product-name");
  const msg = `Hello, I am interested in buying this product.\n\nProduct ID: ${productId}\nProduct Name: ${productName}\n\nPlease share the details.`;

  // Copy message to clipboard then open Instagram
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(() => {
      showToast("Message copied! Paste it in the Instagram DM 👉");
    }).catch(() => {
      showToast("Opening Instagram — copy the message manually.");
    });
  } else {
    // Fallback for older browsers / insecure contexts
    try {
      const ta = document.createElement("textarea");
      ta.value = msg;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Message copied! Paste it in the Instagram DM 👉");
    } catch (e) {
      showToast("Opening Instagram — copy the Product ID manually.");
    }
  }

  // Open Instagram profile after a short delay so the toast is visible
  setTimeout(() => {
    window.open(igLink(), "_blank", "noopener,noreferrer");
  }, 600);
}

function showToast(message) {
  let toast = document.getElementById("zf-toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "zf-toast";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    toast.style.cssText = `
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #141313;
      color: #fdfcfa;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.03em;
      padding: 12px 20px;
      border-radius: 6px;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 320px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.style.opacity = "1";
  toast.style.transform = "translateX(-50%) translateY(0)";
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transform = "translateX(-50%) translateY(12px)";
  }, 3500);
}

/* =========================================================================
   SECTION 7 — EVENT HANDLERS
========================================================================= */
modalBackdrop.addEventListener("click", (e) => {
  if (e.target === modalBackdrop) closeModal();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalBackdrop.classList.contains("open")) closeModal();
});

renderTab("AVAILABLE");
